openapi: 3.1.0
info:
  title: HRS Human Resource System API
  version: 1.0.0-draft
  summary: HRS 考勤、薪酬、年末调整、人事与权限 API
  description: |
    本契约是 HRS 前端、后端、Mock 与测试的唯一字段来源。
    正式金额使用十进制字符串；所有时间戳必须包含时区；业务时区为 Asia/Tokyo。
servers:
  - url: /api/hrs/v1
    description: Same-origin gateway
security:
  - bearerAuth: []
tags:
  - name: Context
  - name: Jobs
  - name: Files
  - name: Personnel
  - name: Access
  - name: Attendance
  - name: Leave
  - name: Salary
  - name: Nencho

paths:
  /context:
    get:
      tags: [Context]
      operationId: getSessionContext
      summary: 获取当前 HRS 会话上下文
      x-phase: 0
      responses:
        '200':
          description: 当前账户、关联职员和最终权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContextResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /dictionaries:
    get:
      tags: [Context]
      operationId: listDictionaries
      summary: 获取 HRS 枚举字典
      x-phase: 0
      responses:
        '200':
          $ref: '#/components/responses/GenericOk'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /references/departments:
    get:
      tags: [Context]
      operationId: listDepartmentReferences
      summary: 获取部门引用数据
      x-phase: 0
      responses:
        '200':
          description: 部门树
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /references/positions:
    get:
      tags: [Context]
      operationId: listPositionReferences
      summary: 获取职位引用数据
      x-phase: 0
      responses:
        '200':
          $ref: '#/components/responses/GenericOk'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /capabilities:
    get:
      tags: [Context]
      operationId: listFeatureCapabilities
      summary: 获取模块启用状态
      x-phase: 0
      responses:
        '200':
          description: 功能能力列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: 查询异步任务
      x-phase: 0
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 异步任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /files/{fileId}/download-ticket:
    post:
      tags: [Files]
      operationId: createDownloadTicket
      summary: 创建受保护文件短期下载票据
      x-phase: 0
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 单用途下载票据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadTicketResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /employees:
    get:
      tags: [Personnel]
      operationId: listEmployees
      summary: 查询职员
      x-phase: 1
      x-permission: HRS:PERSONNEL:DATA
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
        - name: departmentId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/EmployeeStatus' }
          style: form
          explode: false
        - name: employmentType
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 职员分页结果；银行账号始终脱敏
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePageResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Personnel]
      operationId: createEmployee
      summary: 新增职员并触发账户创建
      x-phase: 1
      x-permission: HRS:PERSONNEL:DATA
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEmployeeRequest' }
      responses:
        '201':
          description: 已创建职员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeResponse' }
        default:
          $ref: '#/components/responses/ErrorResponse'
  /employees/{employeeId}:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [Personnel]
      operationId: getEmployee
      summary: 查询职员详情
      x-phase: 1
      x-permission: HRS:PERSONNEL:DATA
      responses:
        '200':
          description: 职员详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeResponse' }
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Personnel]
      operationId: updateEmployee
      summary: 更新职员基本与雇佣资料
      x-phase: 1
      x-permission: HRS:PERSONNEL:DATA
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmployeeRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeResponse' }
        default:
          $ref: '#/components/responses/ErrorResponse'
  /employees/{employeeId}/status-transitions:
    post:
      tags: [Personnel]
      operationId: transitionEmployeeStatus
      summary: 变更职员在职状态
      x-phase: 1
      x-permission: HRS:PERSONNEL:DATA
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeStatusTransitionRequest' }
      responses:
        '201':
          description: 状态变更记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeStatusTransitionResponse' }
        default:
          $ref: '#/components/responses/ErrorResponse'
  /employees/{employeeId}/salary-profile:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [Personnel]
      operationId: getEmployeeSalaryProfile
      summary: 查询职员薪资基础资料
      x-phase: 1
      x-permission: HRS:PERSONNEL:DATA
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    put:
      tags: [Personnel]
      operationId: replaceEmployeeSalaryProfile
      summary: 更新职员薪资基础资料
      x-phase: 1
      x-permission: HRS:PERSONNEL:DATA
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeSalaryProfile' }
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /employees/{employeeId}/bank-account:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [Personnel]
      operationId: getEmployeeBankAccount
      summary: 查询脱敏银行账户
      x-phase: 1
      x-permission: HRS:PERSONNEL:BANK
      responses:
        '200':
          description: 脱敏银行账户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccountResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    put:
      tags: [Personnel]
      operationId: replaceEmployeeBankAccount
      summary: 更新银行账户
      x-phase: 1
      x-permission: HRS:PERSONNEL:BANK
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBankAccountRequest' }
      responses:
        '200':
          description: 已更新的脱敏银行账户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccountResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /employees/{employeeId}/audit-entries:
    get:
      tags: [Personnel]
      operationId: listEmployeeAuditEntries
      summary: 查询职员资料变更历史
      x-phase: 1
      x-permission: HRS:PERSONNEL:DATA
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/GenericPageOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }

  /access/accounts:
    get:
      tags: [Access]
      operationId: listAccessAccounts
      summary: 查询账户及权限摘要
      x-phase: 1
      x-permission: HRS:ACCESS:ADMIN
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/GenericPageOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /access/permissions:
    get:
      tags: [Access]
      operationId: listPermissionCatalog
      summary: 获取权限目录
      x-phase: 1
      x-permission: HRS:ACCESS:ADMIN
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /access/roles:
    get:
      tags: [Access]
      operationId: listRoleTemplates
      summary: 查询角色模板
      x-phase: 1
      x-permission: HRS:ACCESS:ADMIN
      responses:
        '200':
          description: 角色模板列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleListResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Access]
      operationId: createRoleTemplate
      summary: 新增角色模板
      x-phase: 1
      x-permission: HRS:ACCESS:ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201': { $ref: '#/components/responses/GenericCreated' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /access/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    get:
      tags: [Access]
      operationId: getRoleTemplate
      summary: 查询角色模板详情
      x-phase: 1
      x-permission: HRS:ACCESS:ADMIN
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    patch:
      tags: [Access]
      operationId: updateRoleTemplate
      summary: 更新角色模板
      x-phase: 1
      x-permission: HRS:ACCESS:ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /access/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Access]
      operationId: getAccountAccess
      summary: 查询账户角色和个人权限覆盖
      x-phase: 1
      x-permission: HRS:ACCESS:ADMIN
      responses:
        '200':
          description: 账户权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountAccessResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    put:
      tags: [Access]
      operationId: replaceAccountAccess
      summary: 更新角色和个人权限覆盖
      x-phase: 1
      x-permission: HRS:ACCESS:ADMIN
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountAccessRequest' }
      responses:
        '200':
          description: 更新后的权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountAccessResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /access/accounts/{accountId}/effective-permissions:
    get:
      tags: [Access]
      operationId: getEffectivePermissions
      summary: 预览账户最终权限
      x-phase: 1
      x-permission: HRS:ACCESS:ADMIN
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /access/audit-entries:
    get:
      tags: [Access]
      operationId: listAccessAuditEntries
      summary: 查询权限审计记录
      x-phase: 1
      x-permission: HRS:ACCESS:ADMIN
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/GenericPageOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }

  /attendance/today:
    get:
      tags: [Attendance]
      operationId: getTodayAttendance
      summary: 获取本人今日考勤状态
      x-phase: 2
      x-permission: HRS:ATTENDANCE:PUNCH
      responses:
        '200':
          description: 今日事件和汇总
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodayAttendanceResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /attendance/events:
    post:
      tags: [Attendance]
      operationId: createAttendanceEvent
      summary: 提交逐次打卡事件
      x-phase: 2
      x-permission: HRS:ATTENDANCE:PUNCH
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAttendanceEventRequest' }
      responses:
        '201':
          description: 已记录事件及更新后的今日状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodayAttendanceResponse' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /attendance/records:
    get:
      tags: [Attendance]
      operationId: listSelfAttendanceRecords
      summary: 查询本人每日考勤记录
      x-phase: 2
      x-permission: HRS:ATTENDANCE:SELF_VIEW
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AttendanceRecordStatus' }
      responses:
        '200': { $ref: '#/components/responses/GenericPageOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /attendance/records/{recordId}:
    get:
      tags: [Attendance]
      operationId: getSelfAttendanceRecord
      summary: 查询本人记录详情和时间线
      x-phase: 2
      x-permission: HRS:ATTENDANCE:SELF_VIEW
      parameters:
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /attendance/modification-requests:
    get:
      tags: [Attendance]
      operationId: listModificationRequests
      summary: 查询考勤修正申请
      x-phase: 2
      x-permission: HRS:ATTENDANCE:SELF_MODIFY
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: scope
          in: query
          schema: { type: string, enum: [SELF, ADMIN], default: SELF }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApprovalStatus' }
      responses:
        '200': { $ref: '#/components/responses/GenericPageOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Attendance]
      operationId: createModificationRequest
      summary: 提交考勤修正申请
      x-phase: 2
      x-permission: HRS:ATTENDANCE:SELF_MODIFY
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModificationRequest' }
      responses:
        '201': { $ref: '#/components/responses/GenericCreated' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /attendance/modification-requests/{requestId}:
    get:
      tags: [Attendance]
      operationId: getModificationRequest
      summary: 查询修正申请与快照
      x-phase: 2
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /attendance/modification-requests/{requestId}/decisions:
    post:
      tags: [Attendance]
      operationId: decideModificationRequest
      summary: 审批考勤修正申请
      x-phase: 2
      x-permission: HRS:ATTENDANCE:MODIFY_APPROVE
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '201': { $ref: '#/components/responses/GenericCreated' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /leave-applications:
    get:
      tags: [Leave]
      operationId: listLeaveApplications
      summary: 查询请假申请
      x-phase: 2
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: scope
          in: query
          schema: { type: string, enum: [SELF, ADMIN], default: SELF }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeaveStatus' }
      responses:
        '200': { $ref: '#/components/responses/GenericPageOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Leave]
      operationId: createLeaveApplication
      summary: 提交请假申请
      x-phase: 2
      x-permission: HRS:LEAVE:APPLY
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLeaveApplicationRequest' }
      responses:
        '201': { $ref: '#/components/responses/GenericCreated' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /leave-applications/{applicationId}/cancel:
    post:
      tags: [Leave]
      operationId: cancelLeaveApplication
      summary: 撤销本人待审批请假
      x-phase: 2
      x-permission: HRS:LEAVE:APPLY
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedActionRequest' }
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /leave-applications/{applicationId}/decisions:
    post:
      tags: [Leave]
      operationId: decideLeaveApplication
      summary: 审批请假
      x-phase: 2
      x-permission: HRS:LEAVE:APPROVE
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '201': { $ref: '#/components/responses/GenericCreated' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /attendance/config:
    get:
      tags: [Attendance]
      operationId: getAttendanceConfig
      summary: 查询考勤配置
      x-phase: 2
      x-permission: HRS:ATTENDANCE:CONFIG
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    put:
      tags: [Attendance]
      operationId: replaceAttendanceConfig
      summary: 更新考勤配置
      x-phase: 2
      x-permission: HRS:ATTENDANCE:CONFIG
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceConfig' }
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /attendance/types:
    get:
      tags: [Attendance]
      operationId: listAttendanceTypes
      summary: 查询考勤类型
      x-phase: 2
      x-permission: HRS:ATTENDANCE:TYPE
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Attendance]
      operationId: createAttendanceType
      summary: 新增考勤类型
      x-phase: 2
      x-permission: HRS:ATTENDANCE:TYPE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceType' }
      responses:
        '201': { $ref: '#/components/responses/GenericCreated' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /attendance/types/{typeId}:
    parameters:
      - $ref: '#/components/parameters/TypeId'
    patch:
      tags: [Attendance]
      operationId: updateAttendanceType
      summary: 更新考勤类型
      x-phase: 2
      x-permission: HRS:ATTENDANCE:TYPE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceType' }
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [Attendance]
      operationId: deleteAttendanceType
      summary: 删除未被使用的考勤类型
      x-phase: 2
      x-permission: HRS:ATTENDANCE:TYPE
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /attendance/monthly-summaries:
    get:
      tags: [Attendance]
      operationId: listMonthlyAttendanceSummaries
