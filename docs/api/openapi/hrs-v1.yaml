        default: { $ref: '#/components/responses/ErrorResponse' }
    put:
      tags: [Nencho]
      operationId: saveSelfNenchoDeclaration
      summary: 保存申告草稿
      x-phase: 4
      x-permission: HRS:NENCHO:SELF_DECLARE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NenchoDeclaration' }
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /nencho/self/declarations/{declarationId}/certificates:
    post:
      tags: [Nencho]
      operationId: uploadDeductionCertificate
      summary: 上传控除证明文件
      x-phase: 4
      x-permission: HRS:NENCHO:SELF_DECLARE
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [certificateType, file]
              properties:
                certificateType: { type: string }
                file: { type: string, format: binary }
      responses:
        '202': { $ref: '#/components/responses/AcceptedJob' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /nencho/self/declarations/{declarationId}/certificates/{certificateId}:
    delete:
      tags: [Nencho]
      operationId: deleteDeductionCertificate
      summary: 删除未提交证明文件
      x-phase: 4
      x-permission: HRS:NENCHO:SELF_DECLARE
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
        - $ref: '#/components/parameters/CertificateId'
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /nencho/self/declarations/{declarationId}/actions/submit:
    post:
      tags: [Nencho]
      operationId: submitNenchoDeclaration
      summary: 提交申告书
      x-phase: 4
      x-permission: HRS:NENCHO:SELF_DECLARE
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedActionRequest' }
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /nencho/review/declarations:
    get:
      tags: [Nencho]
      operationId: listNenchoDeclarationsForReview
      summary: 查询管理员申告进度
      x-phase: 4
      x-permission: HRS:NENCHO:REVIEW
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: periodId
          in: query
          required: true
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/NenchoDeclarationStatus' }
      responses:
        '200': { $ref: '#/components/responses/GenericPageOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /nencho/review/declarations/{declarationId}:
    get:
      tags: [Nencho]
      operationId: getNenchoDeclarationForReview
      summary: 查询申告审核详情与附件
      x-phase: 4
      x-permission: HRS:NENCHO:REVIEW
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /nencho/review/declarations/{declarationId}/decisions:
    post:
      tags: [Nencho]
      operationId: decideNenchoDeclaration
      summary: 确认或差戻し申告书
      x-phase: 4
      x-permission: HRS:NENCHO:REVIEW
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApprovalDecisionRequest'
                - type: object
                  properties:
                    decision: { type: string, enum: [CONFIRM, RETURN] }
      responses:
        '201': { $ref: '#/components/responses/GenericCreated' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /nencho/periods/{periodId}/actions/migrate-previous-data:
    post:
      tags: [Nencho]
      operationId: migratePreviousNenchoData
      summary: 引继前年申告基础数据
      x-phase: 4
      x-permission: HRS:NENCHO:DATA_MIGRATE
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/AcceptedJob' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /nencho/tax-parameters:
    get:
      tags: [Nencho]
      operationId: listTaxParameterVersions
      summary: 查询税法参数版本
      x-phase: 4
      x-permission: HRS:NENCHO:TAX_PARAM
      parameters:
        - name: year
          in: query
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/GenericOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Nencho]
      operationId: createTaxParameterVersion
      summary: 新增税法参数版本
      x-phase: 4
      x-permission: HRS:NENCHO:TAX_PARAM
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxParameterVersion' }
      responses:
        '201': { $ref: '#/components/responses/GenericCreated' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /nencho/periods/{periodId}/actions/calculate:
    post:
      tags: [Nencho]
      operationId: calculateNenchoPeriod
      summary: 触发年末调整计算
      x-phase: 4
      x-permission: HRS:NENCHO:CALC
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedActionRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedJob' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /nencho/periods/{periodId}/results:
    get:
      tags: [Nencho]
      operationId: listNenchoResults
      summary: 查询過不足税额
      x-phase: 4
      x-permission: HRS:NENCHO:CALC
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/GenericPageOk' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /nencho/periods/{periodId}/actions/settle:
    post:
      tags: [Nencho]
      operationId: settleNenchoPeriod
      summary: 将過不足税额反映到薪资
      x-phase: 4
      x-permission: HRS:NENCHO:ADJUST
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, salaryPeriodId, reason]
              properties:
                version: { type: integer, minimum: 1 }
                salaryPeriodId: { type: string }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '202': { $ref: '#/components/responses/AcceptedJob' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /nencho/periods/{periodId}/withholding-tax-slip-batches:
    post:
      tags: [Nencho]
      operationId: createWithholdingTaxSlipBatch
      summary: 批量生成源泉徴収票
      x-phase: 4
      x-permission: HRS:NENCHO:TAX_SLIP
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: { type: string, enum: [EMPLOYEE, TAX_OFFICE] }
                employeeIds:
                  type: array
                  items: { type: string }
      responses:
        '202': { $ref: '#/components/responses/AcceptedJob' }
        default: { $ref: '#/components/responses/ErrorResponse' }
  /nencho/periods/{periodId}/statutory-report-batches:
    post:
      tags: [Nencho]
      operationId: createStatutoryReportBatch
      summary: 生成法定调书
      x-phase: 4
      x-permission: HRS:NENCHO:STAT_REPORT
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportTypes]
              properties:
                reportTypes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [SALARY_PAYMENT_INDIVIDUAL, SALARY_PAYMENT_SUMMARY, STATUTORY_TOTAL]
      responses:
        '202': { $ref: '#/components/responses/AcceptedJob' }
        default: { $ref: '#/components/responses/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: field:asc,otherField:desc
      schema: { type: string }
    YearMonth:
      name: yearMonth
      in: query
      required: true
      schema: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    EmployeeId: { name: employeeId, in: path, required: true, schema: { type: string } }
    AccountId: { name: accountId, in: path, required: true, schema: { type: string } }
    RoleId: { name: roleId, in: path, required: true, schema: { type: string } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string } }
    FileId: { name: fileId, in: path, required: true, schema: { type: string } }
    RecordId: { name: recordId, in: path, required: true, schema: { type: string } }
    RequestId: { name: requestId, in: path, required: true, schema: { type: string } }
    ApplicationId: { name: applicationId, in: path, required: true, schema: { type: string } }
    TypeId: { name: typeId, in: path, required: true, schema: { type: string } }
    PeriodId: { name: periodId, in: path, required: true, schema: { type: string } }
    SummaryId: { name: summaryId, in: path, required: true, schema: { type: string } }
    ItemId: { name: itemId, in: path, required: true, schema: { type: string } }
    TemplateId: { name: templateId, in: path, required: true, schema: { type: string } }
    DetailId: { name: detailId, in: path, required: true, schema: { type: string } }
    ExportId: { name: exportId, in: path, required: true, schema: { type: string } }
    DeclarationId: { name: declarationId, in: path, required: true, schema: { type: string } }
    CertificateId: { name: certificateId, in: path, required: true, schema: { type: string } }
  responses:
    GenericOk:
      description: 成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericResponse' }
    GenericCreated:
      description: 已创建
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericResponse' }
    GenericPageOk:
      description: 分页成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericPageResponse' }
    AcceptedJob:
      description: 已接受异步任务
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JobResponse' }
    ErrorResponse:
      description: 统一错误；具体 HTTP 状态由响应决定
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
          examples:
            validation:
              value:
                success: false
                code: HRS_VALIDATION_FAILED
                message: 入力内容を確認してください
                data: null
                errors: [{ field: status, reason: invalidState }]
                requestId: req_01
  schemas:
    ApiResponseBase:
      type: object
      required: [success, code, message, requestId]
      properties:
        success: { type: boolean }
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
    GenericResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required: [data]
          properties:
            data: { type: object, additionalProperties: true }
    GenericPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items, page, pageSize, total]
              properties:
                items: { type: array, items: { type: object, additionalProperties: true } }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1, maximum: 100 }
                total: { type: integer, minimum: 0 }
    ApiErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required: [success, data]
          properties:
            success: { const: false }
            data: { type: 'null' }
            errors:
              type: array
              items:
                type: object
                required: [reason]
                properties:
                  field: { type: string }
                  reason: { type: string }
    DataScope:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [SELF, DEPARTMENT, DEPARTMENT_TREE, SELECTED_DEPARTMENTS, ALL] }
        departmentIds: { type: array, items: { type: string } }
    SessionContext:
      type: object
      required: [accountId, displayName, locale, roles, grantedPermissions, revokedPermissions, effectivePermissions, dataScope]
      properties:
        accountId: { type: string }
        employeeId: { type: [string, 'null'] }
        displayName: { type: string }
        locale: { type: string, enum: [ja-JP, zh-CN] }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleSummary' } }
        grantedPermissions: { type: array, items: { type: string } }
        revokedPermissions: { type: array, items: { type: string } }
        effectivePermissions: { type: array, items: { type: string } }
        dataScope: { $ref: '#/components/schemas/DataScope' }
    SessionContextResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/SessionContext' }
    Department:
      type: object
      required: [id, name, code]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        parentId: { type: [string, 'null'] }
    DepartmentListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/Department' } }
    FeatureCapability:
      type: object
      required: [code, enabled, phase]
      properties:
        code: { type: string }
        enabled: { type: boolean }
        phase: { type: integer, minimum: 0 }
        reason: { type: string }
    CapabilityListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/FeatureCapability' } }
    JobStatus: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
    AsyncJob:
      type: object
      required: [jobId, type, status, progress, createdAt]
      properties:
        jobId: { type: string }
        type: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        result: { type: [object, 'null'], additionalProperties: true }
        error: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    JobResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AsyncJob' }
    DownloadTicket:
      type: object
      required: [ticketId, downloadUrl, expiresAt]
      properties:
        ticketId: { type: string }
        downloadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    DownloadTicketResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/DownloadTicket' }
    EmployeeStatus: { type: string, enum: [ACTIVE, RESIGNED, SUSPENDED] }
    EmploymentProfile:
      type: object
      properties:
        hireDate: { type: string, format: date }
        departmentId: { type: string }
        departmentName: { type: string, readOnly: true }
        positionId: { type: string }
        positionName: { type: string, readOnly: true }
        employmentType: { type: string }
        attendanceTypeId: { type: string }
    EmployeeSalaryProfile:
      type: object
      required: [version, salaryTypeId]
      properties:
        version: { type: integer, minimum: 1 }
        salaryTypeId: { type: string }
        baseSalary: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        hourlyWage: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        currency: { type: string, const: JPY }
    Employee:
      type: object
      required: [id, employeeNo, name, nameKana, status, employment, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        employeeNo: { type: string }
        name: { type: string }
        nameKana: { type: string }
        status: { $ref: '#/components/schemas/EmployeeStatus' }
        employment: { $ref: '#/components/schemas/EmploymentProfile' }
        maskedBankAccountNumber: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmployeeResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Employee' }
    EmployeePageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total]
              properties:
                items: { type: array, items: { $ref: '#/components/schemas/Employee' } }
                page: { type: integer }
                pageSize: { type: integer }
                total: { type: integer }
    CreateEmployeeRequest:
      type: object
      required: [employeeNo, name, nameKana, employment]
      properties:
        employeeNo: { type: string, minLength: 1, maxLength: 30 }
        name: { type: string, minLength: 1, maxLength: 100 }
        nameKana: { type: string, minLength: 1, maxLength: 100 }
        employment: { $ref: '#/components/schemas/EmploymentProfile' }
        salaryProfile: { $ref: '#/components/schemas/EmployeeSalaryProfile' }
        username: { type: string, minLength: 3, maxLength: 50 }
    UpdateEmployeeRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 100 }
        nameKana: { type: string, minLength: 1, maxLength: 100 }
        employment: { $ref: '#/components/schemas/EmploymentProfile' }
    EmployeeStatusTransitionRequest:
      type: object
      required: [version, toStatus, effectiveDate, reason]
      properties:
        version: { type: integer, minimum: 1 }
        toStatus: { $ref: '#/components/schemas/EmployeeStatus' }
        effectiveDate: { type: string, format: date }
        reason: { type: string, minLength: 1, maxLength: 500 }
    EmployeeStatusTransitionResponse:
      allOf:
        - $ref: '#/components/schemas/GenericResponse'
    EmployeeBankAccount:
      type: object
      required: [bankName, branchName, accountType, maskedAccountNumber, accountHolderName, version]
      properties:
        bankName: { type: string }
        branchName: { type: string }
        accountType: { type: string, enum: [ORDINARY, CURRENT, SAVINGS] }
        maskedAccountNumber: { type: string, examples: ['****1234'] }
        accountHolderName: { type: string }
        version: { type: integer, minimum: 1 }
    BankAccountResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/EmployeeBankAccount' }
    UpdateBankAccountRequest:
      type: object
      required: [version, bankName, branchName, accountType, accountNumber, accountHolderName]
      properties:
        version: { type: integer, minimum: 1 }
        bankName: { type: string }
        branchName: { type: string }
        accountType: { type: string, enum: [ORDINARY, CURRENT, SAVINGS] }
        accountNumber: { type: string, pattern: '^\\d{1,20}$', writeOnly: true }
        accountHolderName: { type: string }
    RoleSummary:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
    RoleTemplate:
      allOf:
        - $ref: '#/components/schemas/RoleSummary'
        - type: object
          required: [permissions, version]
          properties:
            permissions: { type: array, items: { type: string } }
            version: { type: integer, minimum: 1 }
    RoleListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/RoleTemplate' } }
    CreateRoleRequest:
      type: object
      required: [code, name, permissions]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        name: { type: string }
        permissions: { type: array, uniqueItems: true, items: { type: string } }
    UpdateRoleRequest:
      type: object
      required: [version, name, permissions]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string }
        permissions: { type: array, uniqueItems: true, items: { type: string } }
    AccountAccess:
      type: object
      required: [accountId, roles, grantedPermissions, revokedPermissions, effectivePermissions, dataScope, version]
      properties:
        accountId: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleSummary' } }
        grantedPermissions: { type: array, items: { type: string } }
        revokedPermissions: { type: array, items: { type: string } }
        effectivePermissions: { type: array, items: { type: string } }
        dataScope: { $ref: '#/components/schemas/DataScope' }
        version: { type: integer, minimum: 1 }
    AccountAccessResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AccountAccess' }
    UpdateAccountAccessRequest:
      type: object
      required: [version, roleIds, grantedPermissions, revokedPermissions, dataScope, reason]
      properties:
        version: { type: integer, minimum: 1 }
        roleIds: { type: array, items: { type: string } }
        grantedPermissions: { type: array, items: { type: string } }
        revokedPermissions: { type: array, items: { type: string } }
        dataScope: { $ref: '#/components/schemas/DataScope' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AttendanceEventType: { type: string, enum: [CLOCK_IN, BREAK_START, BREAK_END, CLOCK_OUT] }
    AttendanceDayState: { type: string, enum: [NOT_STARTED, WORKING, ON_BREAK, COMPLETED, NEEDS_REVIEW] }
    AttendanceRecordStatus: { type: string, enum: [NORMAL, PENDING_CORRECTION, CORRECTED] }
    AttendanceEvent:
      type: object
      required: [id, type, occurredAt, source, createdAt]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/AttendanceEventType' }
        occurredAt: { type: string, format: date-time }
        source: { type: string, enum: [WEB, MOBILE, ADMIN_CORRECTION] }
        ipCheck: { type: string, enum: [NOT_REQUIRED, PASSED, FAILED] }
        gpsCheck: { type: string, enum: [NOT_REQUIRED, PASSED, FAILED, UNAVAILABLE] }
        createdAt: { type: string, format: date-time }
    DailyAttendanceSummary:
      type: object
      required: [date, state, workMinutes, breakMinutes, status, version]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        state: { $ref: '#/components/schemas/AttendanceDayState' }
        workMinutes: { type: integer, minimum: 0 }
        breakMinutes: { type: integer, minimum: 0 }
        overtimeMinutes: { type: integer, minimum: 0 }
        lateMinutes: { type: integer, minimum: 0 }
        earlyLeaveMinutes: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/AttendanceRecordStatus' }
        version: { type: integer, minimum: 1 }
    TodayAttendance:
      type: object
      required: [date, state, events, summary, allowedEvents]
      properties:
        date: { type: string, format: date }
        state: { $ref: '#/components/schemas/AttendanceDayState' }
        events: { type: array, items: { $ref: '#/components/schemas/AttendanceEvent' } }
        summary: { $ref: '#/components/schemas/DailyAttendanceSummary' }
        allowedEvents: { type: array, items: { $ref: '#/components/schemas/AttendanceEventType' } }
    TodayAttendanceResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TodayAttendance' }
    CreateAttendanceEventRequest:
      type: object
      required: [type, occurredAt]
      properties:
        type: { $ref: '#/components/schemas/AttendanceEventType' }
        occurredAt: { type: string, format: date-time }
        gps:
          type: object
          properties:
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
            accuracyMeters: { type: number, minimum: 0 }
    ApprovalStatus: { type: string, enum: [PENDING, APPROVED, REJECTED] }
    ApprovalDecisionRequest:
      type: object
      required: [version, decision]
      properties:
        version: { type: integer, minimum: 1 }
        decision: { type: string, enum: [APPROVE, REJECT] }
        comment: { type: string, maxLength: 500 }
    CreateModificationRequest:
      type: object
      required: [recordId, recordVersion, requestedEvents, reason]
      properties:
        recordId: { type: string }
        recordVersion: { type: integer, minimum: 1 }
        requestedEvents:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, occurredAt]
            properties:
              type: { $ref: '#/components/schemas/AttendanceEventType' }
              occurredAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 500 }
    LeaveStatus: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
    CreateLeaveApplicationRequest:
      type: object
      required: [leaveTypeId, startsAt, endsAt, reason]
      properties:
        leaveTypeId: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AttendanceConfig:
      type: object
      required: [settlementDay, roundingRules, version]
      properties:
        settlementDay: { oneOf: [{ type: integer, minimum: 1, maximum: 28 }, { const: MONTH_END }] }
        ipRestrictionEnabled: { type: boolean }
        ipWhitelist: { type: array, items: { type: string } }
        gpsRestrictionEnabled: { type: boolean }
        gpsCenter:
          type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }
            radiusMeters: { type: integer, minimum: 1 }
        roundingRules:
          type: object
          required: [lateMinutes, earlyLeaveMinutes, overtimeMinutes]
          properties:
            lateMinutes: { type: integer, minimum: 1 }
            earlyLeaveMinutes: { type: integer, minimum: 1 }
            overtimeMinutes: { type: integer, minimum: 1 }
        effectiveFrom: { type: string, format: date }
        version: { type: integer, minimum: 1 }
    AttendanceType:
      type: object
      required: [code, name, mode, version]
      properties:
        id: { type: string, readOnly: true }
        code: { type: string }
        name: { type: string }
        mode: { type: string, enum: [FIXED, SCHEDULE, FLEXIBLE] }
        defaultStartTime: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        defaultEndTime: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        targetMinutesPerDay: { type: integer, minimum: 0 }
        description: { type: string }
        version: { type: integer, minimum: 1 }
    PeriodStatus: { type: string, enum: [OPEN, CALCULATING, CALCULATED, SETTLED, FAILED] }
    AttendanceAdjustmentRequest:
      type: object
      required: [version, changes, reason]
      properties:
        version: { type: integer, minimum: 1 }
        changes: { type: object, additionalProperties: { type: integer } }
        reason: { type: string, minLength: 1, maxLength: 500 }
    Money:
      type: string
      pattern: '^\\d{1,14}(\\.\\d{1,4})?$'
      examples: ['320000.00']
    SalaryConfig:
      type: object
      required: [settlementDay, confirmationDeadlineDay, payDay, effectiveFrom, version]
      properties:
        settlementDay: { oneOf: [{ type: integer, minimum: 1, maximum: 28 }, { const: MONTH_END }] }
        confirmationDeadlineDay: { oneOf: [{ type: integer, minimum: 1, maximum: 28 }, { const: MONTH_END }] }
        payDay: { oneOf: [{ type: integer, minimum: 1, maximum: 28 }, { const: MONTH_END }] }
        effectiveFrom: { type: string, format: date }
        version: { type: integer, minimum: 1 }
    SalaryType:
      type: object
      required: [code, name, method, version]
      properties:
        id: { type: string, readOnly: true }
        code: { type: string }
        name: { type: string }
        method: { type: string, enum: [FIXED, HOURLY, SPECIAL] }
        description: { type: string }
        version: { type: integer, minimum: 1 }
    SalaryItemDefinition:
      type: object
      required: [code, name, nameJa, kind, sign, calculationMethod, rounding, active, version]
      properties:
        id: { type: string, readOnly: true }
        code: { type: string }
        name: { type: string }
        nameJa: { type: string }
        kind: { type: string, enum: [FIXED, CUSTOM] }
        sign: { type: string, enum: [CREDIT, DEBIT] }
        calculationMethod: { type: string, enum: [SYSTEM, FIXED_AMOUNT, PERCENTAGE] }
        amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        percentage: { type: [string, 'null'], pattern: '^\\d{1,3}(\\.\\d{1,4})?$' }
        baseItemId: { type: [string, 'null'] }
        rounding:
          type: object
          required: [decimalPlaces, method]
          properties:
            decimalPlaces: { type: integer, minimum: 0, maximum: 4 }
            method: { type: string, enum: [UP, DOWN, HALF_UP] }
        active: { type: boolean }
        version: { type: integer, minimum: 1 }
    SalaryItemListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/SalaryItemDefinition' } }
    SalaryTemplate:
      type: object
      required: [name, itemIds, layout, version]
      properties:
        id: { type: string, readOnly: true }
        name: { type: string }
        itemIds: { type: array, items: { type: string } }
        layout: { type: object, additionalProperties: true }
        default: { type: boolean }
        version: { type: integer, minimum: 1 }
    SalaryPeriodStatus: { type: string, enum: [PENDING, CALCULATING, CALCULATED, FINALIZED, FAILED] }
    SalaryConfirmationStatus: { type: string, enum: [UNCONFIRMED, CONFIRMED_BY_EMPLOYEE, AUTO_CONFIRMED] }
    SalaryPeriod:
      type: object
      required: [id, yearMonth, status, employeeCount, confirmedCount, issueCount, version]
      properties:
        id: { type: string }
        yearMonth: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' }
        status: { $ref: '#/components/schemas/SalaryPeriodStatus' }
        employeeCount: { type: integer, minimum: 0 }
        confirmedCount: { type: integer, minimum: 0 }
        issueCount: { type: integer, minimum: 0 }
        totalNetPay: { $ref: '#/components/schemas/Money' }
        version: { type: integer, minimum: 1 }
    SalaryPeriodListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/SalaryPeriod' } }
    SalaryDetailItem:
      type: object
      required: [itemId, code, name, nameJa, sign, amount, editable]
      properties:
        itemId: { type: string }
        code: { type: string }
        name: { type: string }
        nameJa: { type: string }
        sign: { type: string, enum: [CREDIT, DEBIT] }
        amount: { $ref: '#/components/schemas/Money' }
        editable: { type: boolean }
        manuallyAdjusted: { type: boolean }
        note: { type: string }
    SalaryDetail:
      type: object
      required: [id, employeeId, employeeName, yearMonth, status, confirmationStatus, items, totalCredit, totalDebit, netPay, version]
      properties:
        id: { type: string }
        employeeId: { type: string }
        employeeName: { type: string }
        yearMonth: { type: string }
        status: { $ref: '#/components/schemas/SalaryPeriodStatus' }
        confirmationStatus: { $ref: '#/components/schemas/SalaryConfirmationStatus' }
        confirmedAt: { type: [string, 'null'], format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/SalaryDetailItem' } }
        totalCredit: { $ref: '#/components/schemas/Money' }
        totalDebit: { $ref: '#/components/schemas/Money' }
        netPay: { $ref: '#/components/schemas/Money' }
        version: { type: integer, minimum: 1 }
    SalaryDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/SalaryDetail' }
    SalaryAdjustmentRequest:
      type: object
      required: [version, itemId, amount, reason]
      properties:
        version: { type: integer, minimum: 1 }
        itemId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    FinalizeRequest:
      type: object
      required: [version, reason]
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    CreateLedgerExportRequest:
      type: object
      required: [zenginVersion, encoding]
      properties:
        zenginVersion: { type: string }
        encoding: { type: string, enum: [SHIFT_JIS, UTF_8] }
    ExportStatus: { type: string, enum: [QUEUED, GENERATING, READY, FAILED] }
    BankTransferResult:
      type: object
      required: [processedAt, status, reference, version]
      properties:
        processedAt: { type: string, format: date-time }
        status: { type: string, enum: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, COMPLETED] }
        reference: { type: string }
        note: { type: string, maxLength: 500 }
        resultFileId: { type: string }
        version: { type: integer, minimum: 1 }
    NenchoPeriodStatus: { type: string, enum: [DRAFT, ACTIVE, CLOSED, CALCULATING, CALCULATED, SETTLED] }
    NenchoPeriod:
      type: object
      required: [year, receptionStartDate, receptionEndDate, calculationDate, adjustmentReflectMonth, status, version]
      properties:
        id: { type: string, readOnly: true }
        year: { type: integer, minimum: 2000, maximum: 2100 }
        receptionStartDate: { type: string, format: date }
        receptionEndDate: { type: string, format: date }
        calculationDate: { type: string, format: date }
        adjustmentReflectMonth: { type: integer, minimum: 1, maximum: 12 }
        status: { $ref: '#/components/schemas/NenchoPeriodStatus' }
        version: { type: integer, minimum: 1 }
    NenchoDeclarationStatus: { type: string, enum: [DRAFT, SUBMITTED, CONFIRMED, RETURNED] }
    NenchoDeclaration:
      type: object
      required: [id, periodId, type, status, deductionItems, certificates, version]
      properties:
        id: { type: string }
        periodId: { type: string }
        type: { type: string, enum: [DEPENDENT, INSURANCE, BASIC, HOUSING] }
        status: { $ref: '#/components/schemas/NenchoDeclarationStatus' }
        deductionItems:
          type: array
          items:
            type: object
            required: [type, data]
            properties:
              type: { type: string }
              data: { type: object, additionalProperties: true }
        certificates:
          type: array
          items:
            type: object
            required: [id, type, fileId, scanStatus]
            properties:
              id: { type: string }
              type: { type: string }
              fileId: { type: string }
              scanStatus: { type: string, enum: [PENDING, SAFE, REJECTED] }
              ocrStatus: { type: string, enum: [NOT_REQUESTED, QUEUED, COMPLETED, FAILED] }
              ocrResult: { type: [object, 'null'], additionalProperties: true }
        returnedReason: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
    TaxParameterVersion:
      type: object
      required: [year, category, effectiveFrom, parameters, version]
      properties:
        id: { type: string, readOnly: true }
        year: { type: integer }
        category: { type: string, enum: [TAX_RATE, DEDUCTION_LIMIT, INSURANCE_RATE] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        parameters: { type: object, additionalProperties: true }
        version: { type: integer, minimum: 1 }
    VersionedActionRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 500 }
